  return String(str)

    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');

// ─── handleDrop: collect file names (supports folders) ────────
function handleDrop(event) {
  var fileNames = [];
  var dt = event.dataTransfer;

  // Simple approach first: read from dataTransfer.files (most reliable)
  if (dt.files && dt.files.length > 0) {
    for (var i = 0; i < dt.files.length; i++) {
      fileNames.push(dt.files[i].name);
    }
  }

  // If simple approach got files, use them
  if (fileNames.length > 0) {
    runComparison(fileNames);
    return;
  }

  // Fallback: try webkitGetAsEntry for folder support
  if (dt.items) {
    var pending = 0;
    var hasEntries = false;

    function checkDone() {
      if (pending === 0 && hasEntries) {
        runComparison(fileNames);
      }
    }

    function readEntry(entry) {
      if (entry.isFile) {
        pending++;
        entry.file(function(f) {
          fileNames.push(f.name);
          pending--;
          checkDone();
        }, function() {
          pending--;
          checkDone();
        });
      } else if (entry.isDirectory) {
        pending++;
        var reader = entry.createReader();
        (function readBatch() {
          reader.readEntries(function(entries) {
            if (entries.length === 0) {
              pending--;
              checkDone();
              return;
            }
            entries.forEach(function(e) { readEntry(e); });
            readBatch();
          }, function() {
            pending--;
            checkDone();
          });
        })();
      }
    }

    for (var j = 0; j < dt.items.length; j++) {
      if (dt.items[j].kind !== 'file') continue;
      var entry = dt.items[j].webkitGetAsEntry ? dt.items[j].webkitGetAsEntry() : null;
      if (entry) {
        hasEntries = true;
        readEntry(entry);
      }
    }

    if (!hasEntries) {
      runComparison(fileNames);
    }
  }
}

function extractVersionCore(str) {
  var cleaned = str.replace(/[_\-]?x(?:86|64)[_\-]?/gi, '_');
  cleaned = cleaned.replace(/[_\-]?(Installer|Setup|install|setup)(\s*\(\d+\))?/gi, '');
  cleaned = cleaned.replace(/\s*\(\d{1,4}\)\s*$/, '');
  var m = cleaned.match(/(\d+\.\d+[\.\d]*[\-\w]*(?:\([^)]*\))?)/);
  if (m) return m[1].toLowerCase();
  var fallback = cleaned.replace(/\s*\(\d+\)\s*/g, '').trim();
  return fallback.toLowerCase();
}

// ─── runComparison: match filenames against PORTAL_DATA ───────
function runComparison(fileNames) {
  var results = [];

  function getLatestVersion(sw) {
    if (sw.versionName) return sw.versionName;
    if (sw.link) {
      var path = decodeURIComponent(sw.link).split('/').pop().split('?')[0];
      return path.replace(/\.(exe|msi|zip|7z|rar|tar\.gz)$/i, '') || '';
    }
    return '';
  }

  PORTAL_DATA.software.forEach(function(sw) {
    var latestVer = getLatestVersion(sw);
    var pattern = sw.matchPattern.toLowerCase();
    var matched = null;

    for (var i = 0; i < fileNames.length; i++) {
      var fn = fileNames[i].toLowerCase();
      if (fn.indexOf(pattern) === -1) continue;
      if (sw.matchExclude && fn.indexOf(sw.matchExclude.toLowerCase()) !== -1) continue;
      if (sw.matchRequire && fn.indexOf(sw.matchRequire.toLowerCase()) === -1) continue;
      matched = fileNames[i];
      break;
    }

    if (!matched) {
      results.push({ sw: sw, status: 'notfound', userVer: null, latestVer: latestVer });
      return;
    }

    var userVer = matched.replace(/\.(exe|msi|zip|7z|rar|tar\.gz|gz)$/i, '');

    if (!latestVer) {
      results.push({ sw: sw, status: 'notfound', userVer: userVer, latestVer: '' });
      return;
    }

    var userCore = extractVersionCore(userVer);
    var latestCore = extractVersionCore(latestVer);

    if (userCore && latestCore && userCore === latestCore) {
      results.push({ sw: sw, status: 'good', userVer: userVer, latestVer: latestVer });
    } else {
      results.push({ sw: sw, status: 'update', userVer: userVer, latestVer: latestVer });
    }
  });

  renderCompareResults(fileNames, results);
}

// ─── renderCompareResults ──────────────────────────────────────
function renderCompareResults(fileNames, results) {
  var t = UI_TRANSLATIONS[currentLang] || UI_TRANSLATIONS['en'];

  // Hide drop panel, show results
  document.getElementById('comparePanel').classList.remove('open');
  document.getElementById('compareResults').classList.add('open');

  // ── Detected files ─────────────────────────────────────────
  var detectedCountEl = document.getElementById('detectedCount');
  if (detectedCountEl) detectedCountEl.textContent = fileNames.length;

  var detectedTitleEl = document.getElementById('detectedTitle');
  if (detectedTitleEl) {
    detectedTitleEl.innerHTML = '📎 ' + esc(t.detected) +
      ' (<span id="detectedCount">' + fileNames.length + '</span>)';
  }

  var listEl = document.getElementById('detectedList');
  if (listEl) {
    listEl.innerHTML = fileNames.map(function(n) {
      return '<span class="detected-chip">' + esc(n) + '</span>';
    }).join('');
  }

  // ── Summary badges ─────────────────────────────────────────
  var goodCount  = results.filter(function(r) { return r.status === 'good';     }).length;
  var updCount   = results.filter(function(r) { return r.status === 'update';   }).length;
  var nfCount    = results.filter(function(r) { return r.status === 'notfound'; }).length;

  var summaryEl = document.getElementById('resultsSummary');
  if (summaryEl) {
    summaryEl.innerHTML =
      '<span class="summary-badge match">✅ ' + goodCount + ' ' + esc(t.good) + '</span>' +
      '<span class="summary-badge diff">🔄 ' + updCount  + ' ' + esc(t.update) + '</span>' +
      '<span class="summary-badge notfound">❓ ' + nfCount + ' ' + esc(t.notFound) + '</span>';
  }

  // ── Recompare / close buttons ──────────────────────────────
  var reBtn = document.getElementById('recompareBtn');
  if (reBtn) reBtn.textContent = '🔄 ' + t.recompare;

  var closeResEl = document.getElementById('closeResultsText');
  if (closeResEl) closeResEl.textContent = t.closeResults;

  // ── Result rows: update → notfound → good ──────────────────
  var sorted = results.slice().sort(function(a, b) {
    var order = { update: 0, notfound: 1, good: 2 };
    return order[a.status] - order[b.status];
  });

  var rows = sorted.map(function(r) {
    var sw = r.sw;
    var rowClass, icon, actionHTML, versionsHTML;

    if (r.status === 'good') {
      rowClass = 'match';
      icon = '✅';
      versionsHTML =
        '<span class="result-ver-label">Yours</span>' +
        '<span class="result-ver yours">' + esc(r.userVer) + '</span>' +
        '<span class="result-arrow">→</span>' +
        '<span class="result-ver-label">Latest</span>' +
        '<span class="result-ver latest is-match">' + esc(r.latestVer) + '</span>';
      actionHTML = '<span class="match-label">✅ ' + esc(t.good) + '</span>';

    } else if (r.status === 'update') {
      rowClass = 'diff';
      icon = '🔄';
      versionsHTML =
        '<span class="result-ver-label">Yours</span>' +
        '<span class="result-ver yours">' + esc(r.userVer) + '</span>' +
        '<span class="result-arrow">→</span>' +
        '<span class="result-ver-label">Latest</span>' +
        '<span class="result-ver latest is-diff">' + esc(r.latestVer) + '</span>';
      actionHTML =
        '<button class="dl-btn-sm" onclick="scrollToDl(\'dl-' + esc(sw.id) + '\')">' +
        '🔄 ' + esc(t.update) + ' →</button>';

    } else {
      rowClass = 'notfound';
      icon = '❓';
      versionsHTML =
        '<span class="result-ver yours" style="color:#8a94a6;">' + esc(t.notFound) + '</span>';
      actionHTML =
        '<button class="dl-btn-sm" onclick="scrollToDl(\'dl-' + esc(sw.id) + '\')">' +
        '📥 ' + esc(t.goToDownload) + ' →</button>';
    }

    return [
      '<div class="result-row ' + rowClass + '">',
      '  <div class="result-status">' + icon + '</div>',
      '  <div class="result-info">',
      '    <div class="result-sw-name">' + esc(sw.name) + '</div>',
      '    <div class="result-versions">' + versionsHTML + '</div>',
      '  </div>',
      '  <div class="result-action">' + actionHTML + '</div>',
      '</div>'
    ].join('\n');
  }).join('\n');

  var gridEl = document.getElementById('resultGrid');
  if (gridEl) gridEl.innerHTML = rows;

  // ── Compare note ────────────────────────────────────────────
  var noteEl = document.getElementById('compareNote');
  if (noteEl) noteEl.textContent = t.compareNote;
}

// ─── scrollToDl ───────────────────────────────────────────────
function scrollToDl(id) {
  if (typeof event !== 'undefined' && event) event.preventDefault();
  var el = document.getElementById(id);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.style.transition = 'box-shadow 0.3s, border-color 0.3s';
    el.style.boxShadow = '0 0 0 3px rgba(74,90,138,0.4)';
    el.style.borderColor = '#4a5a8a';
    setTimeout(function() {
      el.style.boxShadow = '';
      el.style.borderColor = '';
    }, 2000);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  // GitHub Pages: portal-data.json을 동적으로 로드하여 최신 데이터 반영
  fetch('portal-data.json')
    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function(data) { PORTAL_DATA = data; })
    .catch(function() { /* embedded fallback */ })
    .finally(function() { renderPortal(); applyTranslations(); });
});
</script>
